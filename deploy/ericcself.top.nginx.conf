# Prepared only. Enable after domain approval, DNS verification and certificate issuance.
limit_req_zone $binary_remote_addr zone=market_api:10m rate=10r/s;
server {
    listen 80;
    server_name ericcself.top;
    location /.well-known/acme-challenge/ { root /var/www/acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl;
    server_name ericcself.top;
    ssl_certificate /etc/letsencrypt/live/ericcself.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ericcself.top/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    client_max_body_size 1m;
    server_tokens off;
    location ~ ^/(docs|redoc|openapi\.json)(/|$) { return 404; }
    location / {
        limit_req zone=market_api burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
