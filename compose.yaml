services:
  api:
    build: .
    image: personal-market-data:0.4.1
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - market-data:/data
      - ./config:/app/config:ro
    mem_limit: 384m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
  worker:
    image: personal-market-data:0.4.1
    build: .
    command: ["python", "-m", "marketdata", "worker"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - market-data:/data
      - ./config:/app/config:ro
    mem_limit: 1100m
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
volumes:
  market-data:
